[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.0-beta"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/g1lg1l/ravune"

# Audio must not glitch in debug builds: optimize everything, keep debug assertions
# (assert_no_alloc only checks the audio thread when debug_assertions are on).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
