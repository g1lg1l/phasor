[package]
name = "ravune-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runs one CLAP or VST3 plugin for Ravune, in its own process"

[dependencies]
clack-extensions = { version = "0.2.0", features = ["clack-host", "audio-ports", "gui", "log", "note-ports", "params", "posix-fd", "state", "thread-check", "timer"] }
clack-host = "0.2.0"
libloading = "0.8.9"
ravune-bridge = { version = "0.9.0-beta", path = "../ravune-bridge" }
vst3 = "0.3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging"] }

# Editor windows: Cocoa on macOS, X11 elsewhere; descriptors plugins watch go through poll.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphics", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString", "objc2-core-foundation"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13.2"

[dev-dependencies]
clack-extensions = { version = "0.2.0", features = ["clack-plugin", "audio-ports", "note-ports", "params", "state"] }
clack-plugin = "0.2.0"

# A tiny CLAP synth and the vst3 crate's gain effect, for the tests (cargo test builds
# them next to the test binaries).
[[example]]
name = "testplug"
crate-type = ["cdylib"]

[[example]]
name = "testgain"
crate-type = ["cdylib"]
