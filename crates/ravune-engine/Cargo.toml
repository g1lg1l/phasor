[package]
name = "ravune-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
assert_no_alloc = "1.1.2"
cpal = "0.18.2"
ravune-core = { version = "0.9.1-beta", path = "../ravune-core" }
no_denormals = "0.3.0"
ravune-bridge = { version = "0.9.1-beta", path = "../ravune-bridge" }
rtrb = "0.4.0"
# smart helpers: the spectrogram for splitting drums from tones (MIT)
realfft = "3.5.0"
symphonia = { version = "0.6.1", features = ["mp3"] }

[dev-dependencies]
ron = "0.12.2"
